<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { font-size: 26px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-size: 20px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .region-text { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .box-title { font-size: 14px; font-weight: 700; }
      .box-desc { font-size: 12px; fill: #334155; }
      .code-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #0f172a; }
      .sg-text { font-size: 11px; fill: #047857; font-weight: 600; }
      .rds-sg-text { font-size: 11px; fill: #b91c1c; font-weight: 600; }
      .arrow-label { font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .arrow-sub { font-size: 11px; fill: #475569; text-anchor: middle; }
      .footer-note { font-size: 12px; fill: #1e293b; }
    </style>
    
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="600" y="45" class="title">Professional AWS Architecture Diagram:</text>
  <text x="600" y="75" class="subtitle">Student Registration Website</text>

  <!-- ========================================================================= -->
  <!-- 1. REGION / OUTER CLOUD BOUNDARY -->
  <!-- ========================================================================= -->
  <rect x="420" y="110" width="750" height="460" rx="4" fill="#f0fdf4" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 4"/>
  
  <!-- Region Flag / Badge -->
  <rect x="430" y="120" width="22" height="22" rx="3" fill="#0284c7"/>
  <path d="M 436 125 L 446 125 L 446 134 L 441 131 L 436 134 Z" fill="#ffffff"/>
  <text x="460" y="136" class="region-text">Region: Europe (Frankfurt / Stockholm) &mdash; eu-central-1</text>

  <!-- ========================================================================= -->
  <!-- 2. END USER (LEFT SIDE) -->
  <!-- ========================================================================= -->
  <g id="end-user" transform="translate(40, 240)">
    <rect x="-10" y="-80" width="120" height="260" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="50" y="-60" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">End User</text>

    <!-- Person Icon -->
    <circle cx="50" cy="0" r="18" fill="none" stroke="#0f172a" stroke-width="3"/>
    <path d="M 26 50 C 26 28, 74 28, 74 50 Z" fill="none" stroke="#0f172a" stroke-width="3"/>
    
    <text x="50" y="80" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Student using</text>
    <text x="50" y="98" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">web browser</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. AMAZON S3 - FRONTEND CONTAINER -->
  <!-- ========================================================================= -->
  <g id="s3-container" transform="translate(170, 200)">
    <rect x="0" y="-50" width="230" height="250" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- S3 Header -->
    <rect x="10" y="-40" width="28" height="28" rx="4" fill="#1e293b"/>
    <path d="M 18 -32 L 30 -32 L 28 -20 L 20 -20 Z" fill="#38bdf8"/>
    <text x="48" y="-22" font-size="14" font-weight="700" fill="#0f172a">Amazon S3 &mdash; Frontend</text>

    <!-- S3 Static Website Hosting Box -->
    <rect x="15" y="0" width="85" height="75" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="57" y="55" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Amazon S3 &mdash;</text>
    <text x="57" y="67" font-size="9" font-weight="600" fill="#15803d" text-anchor="middle">Static Website</text>

    <!-- S3 Bucket Icon -->
    <rect x="42" y="12" width="30" height="26" rx="3" fill="#16a34a"/>
    <ellipse cx="57" cy="12" rx="15" ry="4" fill="#22c55e"/>

    <!-- Arrow from S3 Bucket to Browser -->
    <line x1="100" y1="38" x2="140" y2="38" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Student Browser Box -->
    <rect x="145" y="10" width="70" height="60" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="145" y="10" width="70" height="14" fill="#e2e8f0"/>
    <circle cx="152" cy="17" r="2.5" fill="#ef4444"/>
    <circle cx="159" cy="17" r="2.5" fill="#f59e0b"/>
    <circle cx="166" cy="17" r="2.5" fill="#10b981"/>
    <text x="180" y="52" font-size="9" font-weight="700" fill="#1e293b" text-anchor="middle">Student</text>
    <text x="180" y="63" font-size="9" font-weight="700" fill="#1e293b" text-anchor="middle">Browser</text>

    <!-- Files Box -->
    <rect x="15" y="90" width="200" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="25" y="106" font-size="11" font-weight="700" fill="#0f172a">static website file index.html</text>
    <text x="25" y="122" font-size="10" fill="#475569">HTML, CSS, JavaScript (3 Pages)</text>

    <!-- S3 Bottom Notes -->
    <text x="115" y="152" font-size="10" fill="#334155" text-anchor="middle">The frontend displays a student</text>
    <text x="115" y="166" font-size="10" fill="#334155" text-anchor="middle">registration form with: Full Name,</text>
    <text x="115" y="180" font-size="10" fill="#334155" text-anchor="middle">Email, Student ID, and Photo Upload.</text>
    <text x="115" y="194" font-size="9.5" fill="#0284c7" font-weight="600" text-anchor="middle">S3 bucket policy: Public Read for Web</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. AMAZON VPC -->
  <!-- ========================================================================= -->
  <g id="vpc" transform="translate(440, 160)">
    <!-- VPC Outer Container -->
    <rect x="0" y="0" width="710" height="390" rx="6" fill="#f8fafc" stroke="#15803d" stroke-width="2"/>
    
    <!-- VPC Header -->
    <rect x="12" y="12" width="26" height="26" rx="4" fill="#15803d"/>
    <path d="M 18 25 L 25 18 L 32 25 L 25 32 Z" fill="#ffffff"/>
    <text x="48" y="30" font-size="16" font-weight="800" fill="#15803d">website-vpc &mdash; 10.0.0.0/16</text>

    <!-- --------------------------------------------------------------------- -->
    <!-- PUBLIC SUBNET -->
    <!-- --------------------------------------------------------------------- -->
    <g id="public-subnet" transform="translate(20, 50)">
      <rect x="0" y="0" width="310" height="320" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
      
      <!-- Subnet Header -->
      <rect x="10" y="10" width="22" height="22" rx="3" fill="#22c55e"/>
      <text x="16" y="26" font-size="12" font-weight="bold" fill="#ffffff">9</text>
      <text x="40" y="26" font-size="14" font-weight="700" fill="#15803d">Public subnet (10.0.1.0/24)</text>

      <!-- EC2 Backend Box -->
      <rect x="15" y="45" width="280" height="215" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
      
      <!-- EC2 Header -->
      <rect x="25" y="55" width="24" height="24" rx="3" fill="#d97706"/>
      <text x="56" y="72" font-size="13" font-weight="700" fill="#b45309">Amazon EC2 &mdash; Backend</text>

      <!-- EC2 Icon -->
      <rect x="95" y="85" width="90" height="40" rx="4" fill="#ea580c"/>
      <rect x="105" y="93" width="70" height="24" rx="2" fill="#fed7aa"/>
      <text x="140" y="109" font-size="11" font-weight="800" fill="#9a3412" text-anchor="middle">EC2 INSTANCE</text>

      <!-- App Info -->
      <text x="140" y="140" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Apache HTTP Server + PHP / Node.js</text>
      
      <rect x="25" y="150" width="260" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="32" y="165" class="code-text">/var/www/html/api/register.php</text>

      <rect x="25" y="176" width="260" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="32" y="190" class="code-text">/var/www/config.php &mdash; Database</text>
      <text x="32" y="202" class="code-text">credentials, outside web root</text>

      <!-- EC2 Security Group Box -->
      <rect x="15" y="270" width="280" height="42" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
      <text x="155" y="286" class="sg-text" text-anchor="middle">EC2 Security Group: HTTP port 80 inbound;</text>
      <text x="155" y="300" class="sg-text" text-anchor="middle">SSH port 22 restricted to administrator IP</text>
    </g>

    <!-- --------------------------------------------------------------------- -->
    <!-- PRIVATE DATABASE SUBNET -->
    <!-- --------------------------------------------------------------------- -->
    <g id="private-subnet" transform="translate(360, 50)">
      <rect x="0" y="0" width="330" height="320" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      
      <!-- Subnet Header -->
      <rect x="10" y="10" width="22" height="22" rx="3" fill="#0284c7"/>
      <text x="16" y="26" font-size="12" font-weight="bold" fill="#ffffff">9</text>
      <text x="40" y="26" font-size="14" font-weight="700" fill="#0369a1">Private database subnet (10.0.11.0/24)</text>

      <!-- RDS Box -->
      <rect x="15" y="45" width="300" height="215" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      
      <!-- RDS Header -->
      <rect x="25" y="55" width="24" height="24" rx="3" fill="#dc2626"/>
      <text x="56" y="72" font-size="13" font-weight="700" fill="#991b1b">Amazon RDS for MySQL &mdash; Database</text>

      <!-- RDS Icon -->
      <g transform="translate(125, 85)">
        <rect x="0" y="0" width="50" height="42" rx="6" fill="#3b82f6"/>
        <ellipse cx="25" cy="8" rx="20" ry="6" fill="#93c5fd"/>
        <line x1="5" y1="18" x2="45" y2="18" stroke="#ffffff" stroke-width="2"/>
        <line x1="5" y1="28" x2="45" y2="28" stroke="#ffffff" stroke-width="2"/>
      </g>

      <text x="150" y="142" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Amazon RDS for MySQL</text>

      <!-- Database & Table Details -->
      <rect x="25" y="152" width="280" height="56" rx="4" fill="#ffffff" stroke="#fecaca"/>
      <text x="35" y="172" font-size="12" font-weight="700" fill="#0f172a">Database: <tspan font-family="monospace" fill="#b91c1c">STUDENT_REGISTRATION</tspan></text>
      <text x="35" y="194" font-size="12" font-weight="700" fill="#0f172a">Table: <tspan font-family="monospace" fill="#b91c1c">students</tspan></text>

      <!-- RDS Security Group Box -->
      <rect x="15" y="270" width="300" height="42" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text x="165" y="286" class="rds-sg-text" text-anchor="middle">RDS Security Group: MySQL port 3306</text>
      <text x="165" y="300" class="rds-sg-text" text-anchor="middle">inbound ONLY from the EC2 Security Group</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. ARROWS AND FLOW LABELS -->
  <!-- ========================================================================= -->
  
  <!-- Arrow 1: User to S3 (Load Static Website) -->
  <line x1="120" y1="270" x2="168" y2="270" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="144" y="258" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Load Static</text>
  <text x="144" y="288" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Website</text>

  <!-- Arrow 2: Browser to EC2 Backend (HTTP POST /api/register) -->
  <line x1="390" y1="290" x2="475" y2="290" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="380" y="260" width="105" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="432" y="273" font-size="10.5" font-weight="700" fill="#0284c7" text-anchor="middle">HTTP API Request &mdash;</text>
  <text x="432" y="284" font-size="9" font-family="monospace" fill="#0f172a" text-anchor="middle">POST /api/register</text>

  <!-- Arrow 3: EC2 to RDS (MySQL TCP 3306) -->
  <line x1="750" y1="290" x2="815" y2="290" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="740" y="252" width="90" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="785" y="266" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">MySQL &mdash;</text>
  <text x="785" y="278" font-size="9.5" font-family="monospace" fill="#0f172a" text-anchor="middle">TCP Port 3306 &mdash;</text>
  <text x="785" y="290" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">INSERT Record</text>

  <!-- ========================================================================= -->
  <!-- 6. FOOTNOTE BULLETS -->
  <!-- ========================================================================= -->
  <g transform="translate(420, 590)">
    <text x="0" y="0" class="footer-note">&bull; Database credentials stored outside the web root</text>
    <text x="0" y="20" class="footer-note">&bull; Note: Current API uses HTTP for the lab; should use HTTPS for production</text>
    <text x="0" y="40" class="footer-note">&bull; S3 public access and bucket policy configured appropriately for the chosen website hosting method</text>
  </g>
</svg>

